[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-mcp"
version = "1.0.0"
description = "MCP server connecting Claude Desktop to Gmail via OAuth — search, read, send, reply, manage labels, drafts, and attachments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "gmail-mcp contributors" }]
keywords = ["mcp", "model-context-protocol", "gmail", "claude", "anthropic", "oauth"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.0.0",
  "google-api-python-client>=2.0.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.0.0",
  "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"

[project.urls]
Homepage = "https://github.com/CHANGE_ME/gmail-mcp"
Repository = "https://github.com/CHANGE_ME/gmail-mcp"
Issues = "https://github.com/CHANGE_ME/gmail-mcp/issues"
Changelog = "https://github.com/CHANGE_ME/gmail-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/manifest.json",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # function calls in defaults (FastMCP patterns)
  "SIM105", # contextlib.suppress not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "RUF012"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/gmail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires real Gmail credentials and GMAIL_TEST_REAL=1",
]
addopts = "-ra --strict-markers"
